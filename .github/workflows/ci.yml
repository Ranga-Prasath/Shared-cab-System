name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Start API
        run: |
          pnpm --filter @shared-cab/api dev > api.log 2>&1 &
          echo $! > api.pid
      - name: Wait for API health
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:4000/api/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time"
          cat api.log
          exit 1
      - name: Generate Dart SDK
        run: pnpm run generate:api:dart
      - name: Verify generated Dart SDK is committed
        run: git diff --exit-code packages/dart-api-client
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Stop API
        if: always()
        run: |
          if [ -f api.pid ]; then
            kill $(cat api.pid) || true
          fi
